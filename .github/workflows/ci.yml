name: CI

on:
  push:
    branches: [main, workspace]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://factory:factory@localhost:5432/factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # typecheck, eslint and the route/agent scan in one command
      - run: pnpm exec loopzero check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

  # The gates that say how good the tests and the code are, not only whether they pass. They run
  # beside `check` so a slow mutation run does not hold the fast feedback back.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://factory:factory@localhost:5432/factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit and integration tests with coverage: the input of the CRAP gate.
      - run: pnpm coverage
      # No new function over CRAP 30, and none of the known ones may get worse.
      - run: pnpm crap
      # Copy and paste under 1% of the code.
      - run: pnpm dup

  # The tests must catch changes to the logic: mutation score of the decision code at 90 or more. Its own job,
  # beside `quality`, because it is the slowest gate and grows with every module added to `stryker.config.json`:
  # inside `quality` it ran after coverage and hit that job's limit on slower runners (#181). It runs only unit
  # tests (`vitest.stryker.config.ts`), so it needs no database.
  #
  # A pull request runs incrementally: it starts from the results the integration branch last saved and tests
  # again only the mutants of the files, and of the tests, that differ. The score is over every mutant, reused or
  # not, and the line it must reach is the same. A push to the integration or the release branch tests every
  # mutant again (`--force`) and saves the results, so what a pull request reuses was measured on a branch a pull
  # request cannot write to (a cache saved on a pull request is only visible to that pull request). The limit
  # leaves room over a full run: on 2026-11-27 they took 24 to 38 minutes.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('stryker.config.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ hashFiles('stryker.config.json', 'pnpm-lock.yaml') }}-
      - if: github.event_name == 'pull_request'
        run: pnpm mutation --incremental
      - if: github.event_name != 'pull_request'
        run: pnpm mutation --incremental --force
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request'
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('stryker.config.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
